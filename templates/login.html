<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Stock Screener</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background-color: #f8fafc;
      background-image:
        radial-gradient(circle at 15% 15%, rgba(37, 99, 235, 0.06) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(16, 185, 129, 0.05) 0%, transparent 45%);
      color: #1e293b;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 26rem;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 1rem;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.06), 0 4px 6px -4px rgba(15, 23, 42, 0.04);
      padding: 2rem;
    }
    .hdr { text-align: center; margin-bottom: 1.5rem; }
    .logo {
      width: 3rem; height: 3rem; margin: 0 auto 0.875rem;
      border-radius: 0.75rem;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      display: flex; align-items: center; justify-content: center;
      color: #2563eb;
    }
    h1 {
      font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; color: #0f172a;
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    }
    .badge {
      font-size: 0.6875rem; padding: 2px 8px; border-radius: 9999px;
      background: #eff6ff; color: #1e40af;
      border: 1px solid #bfdbfe; font-weight: 600;
    }
    .sub { font-size: 0.8125rem; color: #64748b; margin-top: 0.375rem; }
    .err {
      margin-bottom: 1.25rem; padding: 0.75rem 0.875rem; border-radius: 0.5rem;
      background: #fef2f2; border: 1px solid #fecaca;
      display: flex; align-items: center; gap: 0.5rem;
      font-size: 0.8125rem; color: #b91c1c;
    }
    form { display: flex; flex-direction: column; gap: 1rem; }
    label.lbl { display: block; font-size: 0.75rem; font-weight: 600; color: #475569; margin-bottom: 0.375rem; }
    .pw-wrap { position: relative; }
    input[type="password"], input[type="text"] {
      width: 100%; background: #ffffff; border: 1px solid #cbd5e1;
      border-radius: 0.5rem; padding: 0.625rem 2.75rem 0.625rem 0.875rem;
      font-size: 0.875rem; color: #0f172a; outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input[type="password"]:focus, input[type="text"]:focus {
      border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }
    .toggle-pw {
      position: absolute; right: 0.625rem; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: #64748b; font-size: 0.75rem; font-weight: 600;
      cursor: pointer; user-select: none; padding: 0.25rem 0.375rem; border-radius: 0.25rem;
    }
    .toggle-pw:hover { color: #0f172a; background: #f1f5f9; }
    .row { display: flex; align-items: center; justify-content: space-between; font-size: 0.75rem; color: #64748b; }
    .rem { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; user-select: none; color: #475569; }
    .rem input { width: 1rem; height: 1rem; accent-color: #2563eb; cursor: pointer; }
    .submit-btn {
      width: 100%; padding: 0.6875rem; border-radius: 0.5rem; border: none;
      background: #2563eb; color: #ffffff; font-size: 0.875rem; font-weight: 600;
      box-shadow: 0 1px 2px 0 rgba(37, 99, 235, 0.25);
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      cursor: pointer; transition: background-color 0.15s ease;
    }
    .submit-btn:hover { background: #1d4ed8; }
    .submit-btn:active { background: #1e40af; }
    .ftr {
      margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #f1f5f9;
      text-align: center; font-size: 0.75rem; color: #94a3b8;
    }
    .ftr p + p { margin-top: 0.25rem; font-size: 0.6875rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="hdr">
      <div class="logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h1>Stock Screener <span class="badge">Private</span></h1>
      <p class="sub">44 MA Rising &amp; Breakout Pattern Scanner</p>
    </div>

    {% if error %}
    <div class="err" role="alert">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="POST" action="/login">
      <div>
        <label for="password" class="lbl">Access Password</label>
        <div class="pw-wrap">
          <input id="password" name="password" type="password" required autofocus placeholder="Enter password...">
          <button type="button" id="btnTogglePassword" class="toggle-pw" aria-label="Show or hide password">Show</button>
        </div>
      </div>

      <div class="row">
        <label class="rem">
          <input type="checkbox" name="remember" checked>
          <span>Keep me signed in (30 days)</span>
        </label>
        <span>Session Protected</span>
      </div>

      <button type="submit" class="submit-btn">
        <span>Sign In</span>
        <span>&rarr;</span>
      </button>
    </form>

    <div class="ftr">
      <p>Access restricted to authorized users.</p>
      <p>Configured via environment authentication.</p>
    </div>
  </div>

  <script>
    const passInput = document.getElementById("password");
    const toggleBtn = document.getElementById("btnTogglePassword");
    toggleBtn.addEventListener("click", () => {
      const hidden = passInput.type === "password";
      passInput.type = hidden ? "text" : "password";
      toggleBtn.textContent = hidden ? "Hide" : "Show";
    });
  </script>
</body>
</html>
