<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — 44 MA & Breakout Scanner</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #0b0f19;
      color: #e5e7eb;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-[#0b0f19] selection:bg-blue-600 selection:text-white">

  <!-- Ambient Background Glow -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-blue-600/15 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-emerald-600/15 rounded-full blur-3xl"></div>
  </div>

  <!-- Login Card -->
  <div class="relative w-full max-w-md bg-gray-900/90 border border-gray-800 rounded-2xl shadow-2xl p-6 sm:p-8 backdrop-blur-xl">
    
    <!-- Branding Header -->
    <div class="text-center mb-6">
      <div class="w-14 h-14 mx-auto mb-3 rounded-2xl bg-blue-600/20 border border-blue-500/40 flex items-center justify-center text-blue-400 font-bold font-mono text-2xl shadow-inner">
        🔒
      </div>
      <h1 class="text-xl font-bold tracking-tight text-white flex items-center justify-center gap-2">
        Protected Scanner
        <span class="text-[11px] px-2 py-0.5 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/30 font-medium">
          Private
        </span>
      </h1>
      <p class="text-xs text-gray-400 mt-1">
        44 MA Breakout & Triangle Pattern Screener
      </p>
    </div>

    <!-- Error Alert Pill (if invalid password) -->
    {% if error %}
    <div class="mb-5 p-3 rounded-xl bg-rose-950/60 border border-rose-500/40 flex items-center gap-2.5 text-xs text-rose-300">
      <span class="text-rose-400 text-base">⚠️</span>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <!-- Login Form -->
    <form method="POST" action="/login" class="space-y-4">
      <div>
        <label for="password" class="block text-xs font-semibold text-gray-300 mb-1.5">
          Website Password
        </label>
        <div class="relative">
          <input
            id="password"
            name="password"
            type="password"
            required
            autofocus
            placeholder="Enter security password..."
            class="w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition pr-10"
          />
          <button
            type="button"
            id="btnTogglePassword"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white text-xs cursor-pointer select-none"
            title="Show / Hide Password"
          >
            👁️
          </button>
        </div>
      </div>

      <div class="flex items-center justify-between text-xs text-gray-400">
        <label class="flex items-center gap-2 cursor-pointer select-none">
          <input
            type="checkbox"
            name="remember"
            checked
            class="w-4 h-4 rounded bg-gray-950 border-gray-700 text-blue-600 focus:ring-0 cursor-pointer"
          />
          <span>Remember me (30 days)</span>
        </label>
        <span class="text-gray-500 text-[11px]">Encrypted Session</span>
      </div>

      <button
        type="submit"
        class="w-full py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-sm font-semibold text-white shadow-lg shadow-blue-600/30 transition flex items-center justify-center gap-2 cursor-pointer font-bold"
      >
        <span>Unlock Scanner</span>
        <span>→</span>
      </button>
    </form>

    <!-- Info Footer -->
    <div class="mt-6 pt-4 border-t border-gray-800 text-center text-xs text-gray-500 space-y-1">
      <p>Access is restricted to authorized traders.</p>
      <p class="text-[11px] text-gray-400">
        Protected with secure environment authentication.
      </p>
    </div>

  </div>

  <script>
    const passInput = document.getElementById("password");
    const toggleBtn = document.getElementById("btnTogglePassword");
    toggleBtn.addEventListener("click", () => {
      if (passInput.type === "password") {
        passInput.type = "text";
        toggleBtn.textContent = "🙈";
      } else {
        passInput.type = "password";
        toggleBtn.textContent = "👁️";
      }
    });
  </script>
</body>
</html>
