<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — 44 MA & Breakout Scanner</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background-color: #0b0f19;
      background-image:
        radial-gradient(circle at 12% 15%, rgba(37, 99, 235, 0.14) 0%, transparent 40%),
        radial-gradient(circle at 88% 85%, rgba(5, 150, 105, 0.14) 0%, transparent 40%);
      color: #e5e7eb;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 28rem;
      background: rgba(17, 24, 39, 0.94);
      border: 1px solid #1f2937;
      border-radius: 1rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65);
      padding: 1.75rem;
    }
    @media (min-width: 640px) { .card { padding: 2rem; } }
    .hdr { text-align: center; margin-bottom: 1.5rem; }
    .logo {
      width: 3.5rem; height: 3.5rem; margin: 0 auto 0.75rem;
      border-radius: 1rem;
      background: rgba(37, 99, 235, 0.2);
      border: 1px solid rgba(59, 130, 246, 0.4);
      display: flex; align-items: center; justify-content: center;
      color: #60a5fa; font-weight: 700; font-size: 1.5rem;
    }
    h1 {
      font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; color: #fff;
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    }
    .badge {
      font-size: 11px; padding: 2px 8px; border-radius: 9999px;
      background: rgba(59, 130, 246, 0.1); color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3); font-weight: 500;
    }
    .sub { font-size: 0.75rem; color: #9ca3af; margin-top: 0.25rem; }
    .err {
      margin-bottom: 1.25rem; padding: 0.75rem; border-radius: 0.75rem;
      background: rgba(76, 5, 25, 0.6); border: 1px solid rgba(244, 63, 94, 0.4);
      display: flex; align-items: center; gap: 0.625rem;
      font-size: 0.75rem; color: #fda4af;
    }
    form { display: flex; flex-direction: column; gap: 1rem; }
    label.lbl { display: block; font-size: 0.75rem; font-weight: 600; color: #d1d5db; margin-bottom: 0.375rem; }
    .pw-wrap { position: relative; }
    input[type="password"], input[type="text"] {
      width: 100%; background: #030712; border: 1px solid #374151;
      border-radius: 0.75rem; padding: 0.625rem 2.5rem 0.625rem 1rem;
      font-size: 0.875rem; color: #fff; outline: none;
    }
    input[type="password"]:focus, input[type="text"]:focus {
      border-color: #3b82f6; box-shadow: 0 0 0 1px #3b82f6;
    }
    .toggle-pw {
      position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: #9ca3af; font-size: 0.85rem;
      cursor: pointer; user-select: none;
    }
    .toggle-pw:hover { color: #fff; }
    .row { display: flex; align-items: center; justify-content: space-between; font-size: 0.75rem; color: #9ca3af; }
    .rem { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; user-select: none; }
    .rem input { width: 1rem; height: 1rem; accent-color: #2563eb; cursor: pointer; }
    .submit-btn {
      width: 100%; padding: 0.625rem; border-radius: 0.75rem; border: none;
      background: #2563eb; color: #fff; font-size: 0.875rem; font-weight: 700;
      box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      cursor: pointer;
    }
    .submit-btn:hover { background: #3b82f6; }
    .submit-btn:active { background: #1d4ed8; }
    .ftr {
      margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #1f2937;
      text-align: center; font-size: 0.75rem; color: #6b7280;
    }
    .ftr p + p { margin-top: 0.25rem; font-size: 11px; color: #9ca3af; }
  </style>
</head>
<body>
  <div class="card">
    <div class="hdr">
      <div class="logo">🔒</div>
      <h1>Protected Scanner <span class="badge">Private</span></h1>
      <p class="sub">44 MA Breakout &amp; Triangle Pattern Screener</p>
    </div>

    {% if error %}
    <div class="err">
      <span style="font-size:1rem;">⚠️</span>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="POST" action="/login">
      <div>
        <label for="password" class="lbl">Website Password</label>
        <div class="pw-wrap">
          <input id="password" name="password" type="password" required autofocus placeholder="Enter security password...">
          <button type="button" id="btnTogglePassword" class="toggle-pw" title="Show / Hide Password">👁️</button>
        </div>
      </div>

      <div class="row">
        <label class="rem">
          <input type="checkbox" name="remember" checked>
          <span>Remember me (30 days)</span>
        </label>
        <span style="color:#6b7280;font-size:11px;">Encrypted Session</span>
      </div>

      <button type="submit" class="submit-btn">
        <span>Unlock Scanner</span>
        <span>→</span>
      </button>
    </form>

    <div class="ftr">
      <p>Access is restricted to authorized traders.</p>
      <p>Protected with secure environment authentication.</p>
    </div>
  </div>

  <script>
    const passInput = document.getElementById("password");
    const toggleBtn = document.getElementById("btnTogglePassword");
    toggleBtn.addEventListener("click", () => {
      const hidden = passInput.type === "password";
      passInput.type = hidden ? "text" : "password";
      toggleBtn.textContent = hidden ? "🙈" : "👁️";
    });
  </script>
</body>
</html>
