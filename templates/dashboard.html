<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>44 MA Touch & Near Scanner — Indian Stocks Screener</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brandDark: '#0b0f19',
            cardDark: '#111827',
            borderDark: '#1f2937',
            accentBlue: '#3b82f6',
            accentGreen: '#10b981',
            accentOrange: '#f59e0b',
            accentPurple: '#8b5cf6',
          },
          fontFamily: {
            mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- React 18, ReactDOM & Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lightweight Charts (TradingView) for 44 MA & Pattern Overlay -->
  <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>

  <style>
    body {
      background-color: #0b0f19;
      color: #e5e7eb;
      font-family: 'Inter', sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #111827;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 3px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #4b5563;
    }
    .sparkline-path {
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-[#0b0f19] text-gray-200 antialiased selection:bg-blue-600 selection:text-white">

  <!-- Root React App Container -->
  <div id="root" class="flex-1 flex flex-col"></div>

  <!-- React Application Logic -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Helper: format numbers
    const fmt = (n) => (n == null || isNaN(n) ? "—" : Number(n).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
    const fmtVol = (n) => {
      if (!n) return "0";
      if (n >= 10000000) return (n / 10000000).toFixed(2) + " Cr";
      if (n >= 100000) return (n / 100000).toFixed(2) + " L";
      if (n >= 1000) return (n / 1000).toFixed(1) + " K";
      return n.toLocaleString("en-IN");
    };

    // Component: Mini Sparkline
    const Sparkline = ({ points, isUp }) => {
      if (!points || points.length < 2) return <span className="text-gray-600">—</span>;
      const min = Math.min(...points);
      const max = Math.max(...points);
      const range = max - min || 1;
      const width = 80;
      const height = 24;
      
      const pathData = points.map((p, i) => {
        const x = (i / (points.length - 1)) * width;
        const y = height - ((p - min) / range) * (height - 4) - 2;
        return `${i === 0 ? 'M' : 'L'} ${x.toFixed(1)} ${y.toFixed(1)}`;
      }).join(' ');

      const strokeColor = isUp ? "#10b981" : "#ef4444";
      return (
        <svg width={width} height={height} className="overflow-visible">
          <path d={pathData} className="sparkline-path" stroke={strokeColor} />
        </svg>
      );
    };

    // Results Table Component (Used for Confirmed and Pre-Breakout Watchlist)
    function StockTable({ items, title, icon, count, badgeColor, onSelectStock, isTriangle = false }) {
      if (!items || items.length === 0) {
        return (
          <div className="bg-gray-900/60 border border-gray-800 rounded-xl p-6 text-center text-gray-500 text-xs">
            No stocks currently in this category.
          </div>
        );
      }

      return (
        <div className="flex flex-col gap-2">
          {/* Section Header */}
          <div className="flex items-center justify-between px-1">
            <h3 className="text-sm font-bold text-gray-200 flex items-center gap-2">
              <span>{icon}</span>
              <span>{title}</span>
              <span className={`px-2 py-0.5 rounded-full text-xs font-mono font-semibold ${badgeColor}`}>
                {count}
              </span>
            </h3>
          </div>

          {/* Table Container */}
          <div className="overflow-x-auto rounded-xl border border-gray-800 bg-gray-900/90 shadow-md custom-scrollbar">
            <table className="w-full text-left text-xs border-collapse">
              <thead>
                <tr className="border-b border-gray-800 bg-gray-950/80 text-gray-400 font-semibold select-none">
                  <th className="py-2.5 px-4">Symbol</th>
                  <th className="py-2.5 px-3">Company</th>
                  <th className="py-2.5 px-3 text-right">CMP (₹)</th>
                  {!isTriangle ? (
                    <>
                      <th className="py-2.5 px-3 text-right">44 MA</th>
                      <th className="py-2.5 px-3 text-right">Distance %</th>
                      <th className="py-2.5 px-3 text-center">Status</th>
                      <th className="py-2.5 px-3 text-right">Day Chg %</th>
                      <th className="py-2.5 px-3 text-right">Volume</th>
                      <th className="py-2.5 px-3 text-center">Timeframe</th>
                    </>
                  ) : (
                    <>
                      <th className="py-2.5 px-3 text-right">Resistance</th>
                      <th className="py-2.5 px-3 text-right">Support</th>
                      <th className="py-2.5 px-3 text-right">Target (1:3)</th>
                      <th className="py-2.5 px-3 text-right">Stop-Loss</th>
                      <th className="py-2.5 px-3 text-center">Status / Entry</th>
                      <th className="py-2.5 px-3 text-center">Touches</th>
                    </>
                  )}
                  <th className="py-2.5 px-3 text-center">Trend (12B)</th>
                  <th className="py-2.5 px-4 text-center">Chart</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-gray-800/60 font-mono">
                {items.map((item) => {
                  const isUp = (item.day_change_pct || 0) >= 0;
                  const dist = item.distance_pct != null ? item.distance_pct : 0;
                  
                  let statusColor = "bg-gray-800 text-gray-300 border-gray-700";
                  if (item.status === "Touching") {
                    statusColor = "bg-blue-900/40 text-blue-300 border-blue-500/40";
                  } else if (item.status && item.status.includes("Above")) {
                    statusColor = "bg-emerald-900/40 text-emerald-300 border-emerald-500/40";
                  } else if (item.status === "Near Below") {
                    statusColor = "bg-amber-900/40 text-amber-300 border-amber-500/40";
                  } else if (item.status && item.status.includes("Confirmed")) {
                    statusColor = "bg-emerald-900/40 text-emerald-300 border-emerald-500/40";
                  } else if (item.status && item.status.includes("Watch")) {
                    statusColor = "bg-amber-900/40 text-amber-300 border-amber-500/40";
                  }

                  return (
                    <tr 
                      key={item.symbol} 
                      className="hover:bg-gray-800/60 transition cursor-pointer"
                      onClick={() => onSelectStock(item)}
                    >
                      <td className="py-2.5 px-4 font-bold text-white hover:text-blue-400">
                        {item.symbol}
                      </td>
                      <td className="py-2.5 px-3 font-sans text-gray-300 text-xs truncate max-w-[150px]" title={item.company}>
                        {item.company}
                      </td>
                      <td className="py-2.5 px-3 text-right font-bold text-gray-100">
                        ₹{fmt(item.cmp)}
                      </td>

                      {!isTriangle ? (
                        <>
                          <td className="py-2.5 px-3 text-right text-blue-400">
                            ₹{fmt(item.ma44)}
                          </td>
                          <td className={`py-2.5 px-3 text-right font-bold ${dist > 0 ? 'text-emerald-400' : 'text-amber-400'}`}>
                            {dist > 0 ? `+${dist.toFixed(2)}%` : `${dist.toFixed(2)}%`}
                          </td>
                          <td className="py-2.5 px-3 text-center font-sans">
                            <span className={`inline-block px-2 py-0.5 rounded text-[11px] font-semibold border ${statusColor}`}>
                              {item.status}
                            </span>
                          </td>
                          <td className={`py-2.5 px-3 text-right font-semibold ${isUp ? 'text-emerald-400' : 'text-red-400'}`}>
                            {isUp ? `+${item.day_change_pct.toFixed(2)}%` : `${item.day_change_pct.toFixed(2)}%`}
                          </td>
                          <td className="py-2.5 px-3 text-right text-gray-400">
                            {fmtVol(item.volume)}
                          </td>
                          <td className="py-2.5 px-3 text-center font-sans">
                            <span className={`inline-block px-2 py-0.5 rounded text-[10px] font-semibold ${
                              item.timeframe === "Both" 
                                ? "bg-purple-900/40 text-purple-300 border border-purple-500/30" 
                                : "bg-gray-800 text-gray-400 border border-gray-700"
                            }`}>
                              {item.timeframe}
                            </span>
                          </td>
                        </>
                      ) : (
                        <>
                          <td className="py-2.5 px-3 text-right text-red-400 font-semibold">
                            ₹{fmt(item.resistance_level)}
                          </td>
                          <td className="py-2.5 px-3 text-right text-emerald-400">
                            ₹{fmt(item.support_level)}
                          </td>
                          <td className="py-2.5 px-3 text-right text-emerald-300 font-bold">
                            ₹{fmt(item.target)}
                          </td>
                          <td className="py-2.5 px-3 text-right text-rose-400">
                            ₹{fmt(item.stop_loss)}
                          </td>
                          <td className="py-2.5 px-3 text-center font-sans">
                            <span className={`inline-block px-2 py-0.5 rounded text-[11px] font-semibold border ${statusColor}`}>
                              {item.status}
                            </span>
                            {item.entry_type && (
                              <div className="text-[10px] text-gray-400 mt-0.5">{item.entry_type}</div>
                            )}
                          </td>
                          <td className="py-2.5 px-3 text-center text-gray-300">
                            {item.touches} touches
                          </td>
                        </>
                      )}

                      <td className="py-2.5 px-3 text-center">
                        <Sparkline points={item.sparkline} isUp={isUp} />
                      </td>

                      <td className="py-2.5 px-4 text-center font-sans">
                        <button 
                          onClick={(e) => {
                            e.stopPropagation();
                            onSelectStock(item);
                          }}
                          className="px-2.5 py-1 rounded bg-blue-600/20 hover:bg-blue-600/40 text-blue-400 text-xs font-semibold border border-blue-500/30 transition flex items-center gap-1 mx-auto"
                        >
                          <span>📈</span> View Pattern
                        </button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // Main App Component
    function App() {
      // Top State
      const [activeTab, setActiveTab] = useState("daily"); // 'daily', 'weekly', 'both', 'ascending', 'symmetrical'
      const [subFilter, setSubFilter] = useState("all"); // 'all', 'confirmed', 'watch'
      const [indexSelector, setIndexSelector] = useState("nifty500");
      const [loading, setLoading] = useState(false);
      const [lastUpdated, setLastUpdated] = useState("");
      const [searchQuery, setSearchQuery] = useState("");

      // 44 MA Scanner Results
      const [scannerData, setScannerData] = useState({
        daily_confirmed: [], daily_watch: [],
        weekly_confirmed: [], weekly_watch: [],
        both_confirmed: [], both_watch: []
      });
      const [counts, setCounts] = useState({
        daily: 0, daily_confirmed: 0, daily_watch: 0,
        weekly: 0, weekly_confirmed: 0, weekly_watch: 0,
        both: 0, both_confirmed: 0, both_watch: 0
      });

      // Triangles Results
      const [trianglesData, setTrianglesData] = useState({
        ascending_confirmed: [], ascending_watch: [],
        symmetrical_confirmed: [], symmetrical_watch: []
      });
      const [triCounts, setTriCounts] = useState({
        ascending: 0, ascending_confirmed: 0, ascending_watch: 0,
        symmetrical: 0, symmetrical_confirmed: 0, symmetrical_watch: 0
      });

      // Sidebar Filters
      const [maxAbove, setMaxAbove] = useState(2.0);
      const [maxBelow, setMaxBelow] = useState(3.0);
      const [statusTouch, setStatusTouch] = useState(true);
      const [statusAbove, setStatusAbove] = useState(true);
      const [statusNearBelow, setStatusNearBelow] = useState(true);
      const [minPrice, setMinPrice] = useState(0);
      const [minWeeklyVol, setMinWeeklyVol] = useState(100000);
      const [risingOnly, setRisingOnly] = useState(false);
      const [greenOnly, setGreenOnly] = useState(false);

      // Modal Chart View
      const [selectedStock, setSelectedStock] = useState(null);
      const [chartTf, setChartTf] = useState("daily");
      const [chartDataState, setChartDataState] = useState(null);
      const chartContainerRef = useRef(null);
      const chartInstance = useRef(null);

      // Fetch 44 MA Data
      const fetch44MaData = async (forceRefresh = false) => {
        setLoading(true);
        try {
          const statuses = [];
          if (statusTouch) statuses.push("touching");
          if (statusAbove) statuses.push("above");
          if (statusNearBelow) statuses.push("near below");

          const params = new URLSearchParams({
            index: indexSelector,
            max_above: maxAbove,
            max_below: maxBelow,
            min_price: minPrice,
            min_weekly_vol: minWeeklyVol,
            rising_only: risingOnly ? "1" : "0",
            green_only: greenOnly ? "1" : "0",
            statuses: statuses.join(","),
            refresh: forceRefresh ? "1" : "0"
          });

          const res = await fetch(`/api/scanner/44ma?${params.toString()}`);
          if (!res.ok) throw new Error("Failed to load scanner data");
          const data = await res.json();
          
          setScannerData({
            daily_confirmed: data.results?.daily_confirmed || [],
            daily_watch: data.results?.daily_watch || [],
            weekly_confirmed: data.results?.weekly_confirmed || [],
            weekly_watch: data.results?.weekly_watch || [],
            both_confirmed: data.results?.both_confirmed || [],
            both_watch: data.results?.both_watch || [],
          });
          setCounts(data.counts || {});
          setLastUpdated(data.last_updated || new Date().toLocaleTimeString());
        } catch (err) {
          console.error("44 MA Scanner fetch error:", err);
        } finally {
          setLoading(false);
        }
      };

      // Fetch Triangles Data
      const fetchTrianglesData = async () => {
        try {
          const res = await fetch(`/api/scanner/triangles?index=${indexSelector}&timeframe=daily`);
          if (!res.ok) throw new Error("Failed to load triangle data");
          const data = await res.json();
          setTrianglesData({
            ascending_confirmed: data.ascending_confirmed || [],
            ascending_watch: data.ascending_watch || [],
            symmetrical_confirmed: data.symmetrical_confirmed || [],
            symmetrical_watch: data.symmetrical_watch || [],
          });
          setTriCounts(data.counts || {});
        } catch (err) {
          console.error("Triangles fetch error:", err);
        }
      };

      useEffect(() => {
        fetch44MaData();
        fetchTrianglesData();
      }, [indexSelector, maxAbove, maxBelow, statusTouch, statusAbove, statusNearBelow, minPrice, minWeeklyVol, risingOnly, greenOnly]);

      // Filter by search query
      const filterItems = (list) => {
        if (!searchQuery.trim()) return list;
        const q = searchQuery.toLowerCase().trim();
        return (list || []).filter(it => 
          it.symbol.toLowerCase().includes(q) || 
          (it.company && it.company.toLowerCase().includes(q))
        );
      };

      // Chart Rendering with Trendlines and Breakout Candle Marker
      useEffect(() => {
        if (!selectedStock || !chartContainerRef.current) return;

        let isMounted = true;
        const container = chartContainerRef.current;
        container.innerHTML = "";

        const chart = LightweightCharts.createChart(container, {
          width: container.clientWidth,
          height: 480,
          layout: {
            background: { color: "#0b0f19" },
            textColor: "#9ca3af",
          },
          grid: {
            vertLines: { color: "#1f2937" },
            horzLines: { color: "#1f2937" },
          },
          timeScale: {
            borderColor: "#374151",
            timeVisible: true,
          },
          rightPriceScale: {
            borderColor: "#374151",
          },
        });
        chartInstance.current = chart;

        const candleSeries = chart.addCandlestickSeries({
          upColor: "#10b981",
          downColor: "#ef4444",
          borderVisible: false,
          wickUpColor: "#10b981",
          wickDownColor: "#ef4444",
        });

        const ma44Series = chart.addLineSeries({
          color: "#3b82f6",
          lineWidth: 2,
          title: "44 MA",
        });

        // Resistance line series
        const resSeries = chart.addLineSeries({
          color: "#f87171",
          lineWidth: 2,
          lineStyle: 0, // Solid
          title: "Upper Resistance",
        });

        // Support line series
        const supSeries = chart.addLineSeries({
          color: "#34d399",
          lineWidth: 2,
          lineStyle: 0, // Solid
          title: "Lower Support",
        });

        fetch(`/api/chart/${selectedStock.symbol}?tf=${chartTf}`)
          .then(res => res.json())
          .then(data => {
            if (!isMounted || !data.candles) return;
            setChartDataState(data);
            candleSeries.setData(data.candles);

            if (data.ma44_line) {
              ma44Series.setData(data.ma44_line);
            }

            // Draw Chart Pattern Trendlines if present
            if (data.resistance_line && data.resistance_line.length >= 2) {
              resSeries.setData(data.resistance_line);
            }
            if (data.support_line && data.support_line.length >= 2) {
              supSeries.setData(data.support_line);
            }

            // ══════════════════════════════════════════════════════════
            // EXPLICIT BREAKOUT CANDLE / 44 MA TOUCH MARKER
            // ══════════════════════════════════════════════════════════
            const markers = [];

            if (data.breakout_candle_date) {
              markers.push({
                time: data.breakout_candle_date,
                position: 'aboveBar',
                color: '#10b981',
                shape: 'arrowDown',
                text: '🚀 BREAKOUT CANDLE',
                size: 2,
              });
            } else if (data.touch_candle_date) {
              markers.push({
                time: data.touch_candle_date,
                position: 'belowBar',
                color: '#3b82f6',
                shape: 'arrowUp',
                text: '📍 44 MA TOUCH',
                size: 2,
              });
            }

            if (markers.length > 0) {
              candleSeries.setMarkers(markers);
            }

            chart.timeScale().fitContent();
          })
          .catch(err => console.error("Chart load err:", err));

        const handleResize = () => {
          if (chartInstance.current && container) {
            chartInstance.current.applyOptions({ width: container.clientWidth });
          }
        };
        window.addEventListener("resize", handleResize);

        return () => {
          isMounted = false;
          window.removeEventListener("resize", handleResize);
          if (chartInstance.current) {
            chartInstance.current.remove();
            chartInstance.current = null;
          }
        };
      }, [selectedStock, chartTf]);

      // Active Section Lists Resolution
      const currentConfirmed = useMemo(() => {
        if (activeTab === "daily") return filterItems(scannerData.daily_confirmed);
        if (activeTab === "weekly") return filterItems(scannerData.weekly_confirmed);
        if (activeTab === "both") return filterItems(scannerData.both_confirmed);
        if (activeTab === "ascending") return filterItems(trianglesData.ascending_confirmed);
        if (activeTab === "symmetrical") return filterItems(trianglesData.symmetrical_confirmed);
        return [];
      }, [activeTab, scannerData, trianglesData, searchQuery]);

      const currentWatch = useMemo(() => {
        if (activeTab === "daily") return filterItems(scannerData.daily_watch);
        if (activeTab === "weekly") return filterItems(scannerData.weekly_watch);
        if (activeTab === "both") return filterItems(scannerData.both_watch);
        if (activeTab === "ascending") return filterItems(trianglesData.ascending_watch);
        if (activeTab === "symmetrical") return filterItems(trianglesData.symmetrical_watch);
        return [];
      }, [activeTab, scannerData, trianglesData, searchQuery]);

      const isTriangleTab = activeTab === "ascending" || activeTab === "symmetrical";

      return (
        <div className="flex flex-col min-h-screen">
          {/* Header */}
          <header className="border-b border-gray-800 bg-[#0f172a] px-5 py-3 sticky top-0 z-30 shadow-md">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-lg bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-blue-400 font-bold font-mono text-xl">
                  44
                </div>
                <div>
                  <h1 className="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                    44 MA Touch & Near Scanner
                    <span className="text-xs px-2 py-0.5 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20 font-normal">
                      NSE India
                    </span>
                  </h1>
                  <p className="text-xs text-gray-400">
                    Separate Daily & Weekly Alerts with Confirmed & Pre-Breakout Watchlists
                  </p>
                </div>
              </div>

              {/* Header Right Controls */}
              <div className="flex items-center flex-wrap gap-3">
                <div className="flex items-center space-x-1.5 bg-gray-900 border border-gray-700/60 rounded-lg px-2.5 py-1 text-xs">
                  <span className="text-gray-400 font-medium">Universe:</span>
                  <select 
                    value={indexSelector} 
                    onChange={(e) => setIndexSelector(e.target.value)}
                    className="bg-transparent text-white font-semibold focus:outline-none cursor-pointer"
                  >
                    <option value="nifty500" className="bg-gray-900">Nifty 500 (Full)</option>
                    <option value="nifty100" className="bg-gray-900">Nifty 100 (Large)</option>
                    <option value="nifty50" className="bg-gray-900">Nifty 50 (Core)</option>
                  </select>
                </div>

                <a 
                  href={`/api/export/csv?tab=${activeTab}&index=${indexSelector}&max_above=${maxAbove}&max_below=${maxBelow}`}
                  className="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg bg-gray-800 hover:bg-gray-700 text-xs font-medium text-gray-200 border border-gray-700 transition"
                  title="Export results to CSV"
                >
                  <span>⬇ CSV</span>
                </a>

                <button 
                  onClick={() => fetch44MaData(true)} 
                  disabled={loading}
                  className="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-xs font-semibold text-white shadow-sm transition disabled:opacity-50"
                >
                  <span>{loading ? "Scanning..." : "⟳ Scan Now"}</span>
                </button>
              </div>
            </div>
          </header>

          {/* Subheader Status Banner */}
          <div className="bg-[#111827]/70 border-b border-gray-800/80 px-5 py-2 text-xs text-gray-400">
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              <div className="flex items-center gap-4">
                <span className="flex items-center gap-1.5">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span>EOD Cached & Refreshed after 4:00 PM IST</span>
                </span>
                <span>•</span>
                <span>Last Updated: <b className="text-gray-300 font-mono">{lastUpdated || "Live"}</b></span>
              </div>
              <div className="text-gray-400 hidden sm:block">
                Touch: Low ≤ 44MA ≤ High • Above Zone: 0 to +{maxAbove}% • Near Below: 0 to -{maxBelow}%
              </div>
            </div>
          </div>

          {/* Main Layout: Sidebar Filters + Results Content */}
          <div className="max-w-7xl mx-auto w-full px-4 py-5 flex-1 flex flex-col lg:flex-row gap-6">
            
            {/* SIDEBAR FILTERS (All User Adjustable) */}
            <aside className="w-full lg:w-72 flex-shrink-0 bg-gray-900/90 border border-gray-800 rounded-xl p-4 flex flex-col gap-5 shadow-lg h-fit">
              <div className="flex items-center justify-between border-b border-gray-800 pb-2.5">
                <h2 className="text-sm font-bold text-white flex items-center gap-2">
                  <span>⚙</span> Screener Filters
                </h2>
                <button 
                  onClick={() => {
                    setMaxAbove(2.0);
                    setMaxBelow(3.0);
                    setStatusTouch(true);
                    setStatusAbove(true);
                    setStatusNearBelow(true);
                    setMinPrice(0);
                    setMinWeeklyVol(100000);
                    setRisingOnly(false);
                    setGreenOnly(false);
                  }}
                  className="text-[11px] text-blue-400 hover:underline"
                >
                  Reset Defaults
                </button>
              </div>

              {/* Slider 1: Max Above MA44 (0.5% - 5%) */}
              <div>
                <div className="flex justify-between text-xs mb-1">
                  <span className="text-gray-300 font-medium">Max Above MA44 (+A)</span>
                  <span className="font-mono text-emerald-400 font-bold">+{maxAbove.toFixed(1)}%</span>
                </div>
                <input 
                  type="range" 
                  min="0.5" 
                  max="5.0" 
                  step="0.1" 
                  value={maxAbove}
                  onChange={(e) => setMaxAbove(parseFloat(e.target.value))}
                  className="w-full accent-emerald-500 cursor-pointer h-1.5 bg-gray-700 rounded-lg"
                />
                <span className="text-[10px] text-gray-500">Excludes stocks &gt; {maxAbove}% above MA44</span>
              </div>

              {/* Slider 2: Max Below MA44 (0.5% - 5%) */}
              <div>
                <div className="flex justify-between text-xs mb-1">
                  <span className="text-gray-300 font-medium">Max Below MA44 (-B)</span>
                  <span className="font-mono text-amber-400 font-bold">-{maxBelow.toFixed(1)}%</span>
                </div>
                <input 
                  type="range" 
                  min="0.5" 
                  max="5.0" 
                  step="0.1" 
                  value={maxBelow}
                  onChange={(e) => setMaxBelow(parseFloat(e.target.value))}
                  className="w-full accent-amber-500 cursor-pointer h-1.5 bg-gray-700 rounded-lg"
                />
                <span className="text-[10px] text-gray-500">Qualifies down to -{maxBelow}% below MA44</span>
              </div>

              {/* Status Checkboxes */}
              <div className="border-t border-gray-800 pt-3">
                <span className="text-xs font-semibold text-gray-300 block mb-2">Status Qualifications:</span>
                <div className="flex flex-col gap-2 text-xs">
                  <label className="flex items-center gap-2 cursor-pointer hover:text-white">
                    <input 
                      type="checkbox" 
                      checked={statusTouch} 
                      onChange={(e) => setStatusTouch(e.target.checked)}
                      className="rounded bg-gray-800 border-gray-700 text-blue-500 focus:ring-0"
                    />
                    <span className="px-2 py-0.5 rounded text-[11px] font-medium bg-blue-900/40 text-blue-300 border border-blue-500/30">
                      Touching
                    </span>
                    <span className="text-gray-400 text-[11px]">(Low ≤ MA ≤ High)</span>
                  </label>

                  <label className="flex items-center gap-2 cursor-pointer hover:text-white">
                    <input 
                      type="checkbox" 
                      checked={statusAbove} 
                      onChange={(e) => setStatusAbove(e.target.checked)}
                      className="rounded bg-gray-800 border-gray-700 text-emerald-500 focus:ring-0"
                    />
                    <span className="px-2 py-0.5 rounded text-[11px] font-medium bg-emerald-900/40 text-emerald-300 border border-emerald-500/30">
                      Above (0-{maxAbove}%)
                    </span>
                  </label>

                  <label className="flex items-center gap-2 cursor-pointer hover:text-white">
                    <input 
                      type="checkbox" 
                      checked={statusNearBelow} 
                      onChange={(e) => setStatusNearBelow(e.target.checked)}
                      className="rounded bg-gray-800 border-gray-700 text-amber-500 focus:ring-0"
                    />
                    <span className="px-2 py-0.5 rounded text-[11px] font-medium bg-amber-900/40 text-amber-300 border border-amber-500/30">
                      Near Below (-{maxBelow}%)
                    </span>
                  </label>
                </div>
              </div>

              {/* Minimum Weekly Volume */}
              <div className="border-t border-gray-800 pt-3">
                <div className="flex justify-between text-xs mb-1">
                  <span className="text-gray-300 font-medium">Min Weekly Volume</span>
                  <span className="font-mono text-gray-200">{fmtVol(minWeeklyVol)}</span>
                </div>
                <input 
                  type="range" 
                  min="0" 
                  max="1000000" 
                  step="50000" 
                  value={minWeeklyVol}
                  onChange={(e) => setMinWeeklyVol(parseInt(e.target.value))}
                  className="w-full accent-blue-500 cursor-pointer h-1.5 bg-gray-700 rounded-lg"
                />
              </div>

              {/* Toggles: MA44 Rising & Green Candle */}
              <div className="border-t border-gray-800 pt-3 flex flex-col gap-2.5">
                <label className="flex items-center justify-between text-xs cursor-pointer">
                  <span className="text-gray-300">MA44 Rising Only</span>
                  <input 
                    type="checkbox" 
                    checked={risingOnly} 
                    onChange={(e) => setRisingOnly(e.target.checked)}
                    className="rounded bg-gray-800 border-gray-700 text-blue-500 focus:ring-0"
                  />
                </label>
                <span className="text-[10px] text-gray-500">Today's MA44 &gt; MA44 5 bars ago</span>

                <label className="flex items-center justify-between text-xs cursor-pointer pt-1">
                  <span className="text-gray-300">Green Candle Only</span>
                  <input 
                    type="checkbox" 
                    checked={greenOnly} 
                    onChange={(e) => setGreenOnly(e.target.checked)}
                    className="rounded bg-gray-800 border-gray-700 text-emerald-500 focus:ring-0"
                  />
                </label>
                <span className="text-[10px] text-gray-500">Last Close &gt; Last Open</span>
              </div>
            </aside>

            {/* MAIN CONTENT AREA */}
            <main className="flex-1 flex flex-col gap-5">
              
              {/* PRIMARY ALERT SECTION TABS */}
              <div className="flex flex-wrap items-center justify-between gap-3 border-b border-gray-800 pb-3">
                <div className="flex flex-wrap items-center gap-2">
                  {/* Dedicated 44 Daily Alerts Tab */}
                  <button
                    onClick={() => setActiveTab("daily")}
                    className={`px-3.5 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-2 ${
                      activeTab === "daily"
                        ? "bg-blue-600 text-white shadow"
                        : "bg-gray-800/80 text-gray-300 hover:bg-gray-800 hover:text-white"
                    }`}
                  >
                    <span>📅 44 MA Daily Alerts</span>
                    <span className="px-1.5 py-0.2 rounded-full bg-blue-900/80 text-[11px] font-mono">
                      {counts.daily || (scannerData.daily_confirmed.length + scannerData.daily_watch.length)}
                    </span>
                  </button>

                  {/* Dedicated 44 Weekly Alerts Tab */}
                  <button
                    onClick={() => setActiveTab("weekly")}
                    className={`px-3.5 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-2 ${
                      activeTab === "weekly"
                        ? "bg-blue-600 text-white shadow"
                        : "bg-gray-800/80 text-gray-300 hover:bg-gray-800 hover:text-white"
                    }`}
                  >
                    <span>🗓️ 44 MA Weekly Alerts</span>
                    <span className="px-1.5 py-0.2 rounded-full bg-blue-900/80 text-[11px] font-mono">
                      {counts.weekly || (scannerData.weekly_confirmed.length + scannerData.weekly_watch.length)}
                    </span>
                  </button>

                  {/* Both Daily + Weekly Confluence Tab */}
                  <button
                    onClick={() => setActiveTab("both")}
                    className={`px-3.5 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-2 ${
                      activeTab === "both"
                        ? "bg-purple-600 text-white shadow"
                        : "bg-gray-800/80 text-gray-300 hover:bg-gray-800 hover:text-white"
                    }`}
                  >
                    <span>⭐ Both (Daily & Weekly)</span>
                    <span className="px-1.5 py-0.2 rounded-full bg-purple-900/80 text-[11px] font-mono">
                      {counts.both || (scannerData.both_confirmed.length + scannerData.both_watch.length)}
                    </span>
                  </button>

                  {/* Ascending Triangle Tab */}
                  <button
                    onClick={() => setActiveTab("ascending")}
                    className={`px-3.5 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-2 ${
                      activeTab === "ascending"
                        ? "bg-emerald-600 text-white shadow"
                        : "bg-gray-800/80 text-gray-300 hover:bg-gray-800 hover:text-white"
                    }`}
                  >
                    <span>📐 Ascending Triangle (1:3 R:R)</span>
                    <span className="px-1.5 py-0.2 rounded-full bg-emerald-900/60 text-emerald-300 text-[11px] font-mono">
                      {triCounts.ascending || (trianglesData.ascending_confirmed.length + trianglesData.ascending_watch.length)}
                    </span>
                  </button>

                  {/* Symmetrical Triangle Tab */}
                  <button
                    onClick={() => setActiveTab("symmetrical")}
                    className={`px-3.5 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-2 ${
                      activeTab === "symmetrical"
                        ? "bg-amber-600 text-white shadow"
                        : "bg-gray-800/80 text-gray-300 hover:bg-gray-800 hover:text-white"
                    }`}
                  >
                    <span>📐 Symmetrical Triangle (Coil)</span>
                    <span className="px-1.5 py-0.2 rounded-full bg-amber-900/60 text-amber-300 text-[11px] font-mono">
                      {triCounts.symmetrical || (trianglesData.symmetrical_confirmed.length + trianglesData.symmetrical_watch.length)}
                    </span>
                  </button>
                </div>

                {/* Search Box */}
                <div className="relative">
                  <input
                    type="text"
                    placeholder="Search stock symbol..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 w-48 sm:w-56"
                  />
                  {searchQuery && (
                    <button 
                      onClick={() => setSearchQuery("")}
                      className="absolute right-2 top-1.5 text-gray-500 hover:text-gray-300 text-xs"
                    >
                      ✕
                    </button>
                  )}
                </div>
              </div>

              {/* Sub-Filter Toggles: All Signals | Confirmed Only | Pre-Breakout Watchlist */}
              <div className="flex flex-wrap items-center justify-between gap-3 bg-gray-900/70 p-2.5 rounded-xl border border-gray-800">
                <div className="flex items-center gap-2">
                  <span className="text-xs text-gray-400 font-medium">View:</span>
                  <button
                    onClick={() => setSubFilter("all")}
                    className={`px-3 py-1 rounded-lg text-xs font-medium transition ${
                      subFilter === "all" ? "bg-gray-800 text-white border border-gray-700" : "text-gray-400 hover:text-gray-200"
                    }`}
                  >
                    ⚡ All Signals ({currentConfirmed.length + currentWatch.length})
                  </button>
                  <button
                    onClick={() => setSubFilter("confirmed")}
                    className={`px-3 py-1 rounded-lg text-xs font-medium transition flex items-center gap-1.5 ${
                      subFilter === "confirmed" 
                        ? "bg-emerald-900/50 text-emerald-300 border border-emerald-500/40" 
                        : "text-gray-400 hover:text-emerald-400"
                    }`}
                  >
                    <span>✅ Confirmed ({currentConfirmed.length})</span>
                  </button>
                  <button
                    onClick={() => setSubFilter("watch")}
                    className={`px-3 py-1 rounded-lg text-xs font-medium transition flex items-center gap-1.5 ${
                      subFilter === "watch" 
                        ? "bg-amber-900/50 text-amber-300 border border-amber-500/40" 
                        : "text-gray-400 hover:text-amber-400"
                    }`}
                  >
                    <span>👀 Pre-Breakout Watch ({currentWatch.length})</span>
                  </button>
                </div>

                <div className="text-xs text-gray-400">
                  Click any stock row to view interactive pattern drawing & breakout candle marker
                </div>
              </div>

              {/* ══════════════════════════════════════════════════════════ */}
              {/* SEPARATE SECTIONS: CONFIRMED & PRE-BREAKOUT WATCHLIST    */}
              {/* ══════════════════════════════════════════════════════════ */}
              
              {loading ? (
                <div className="bg-gray-900/50 border border-gray-800 rounded-xl py-16 text-center text-gray-400 text-sm">
                  <div className="inline-block animate-spin mr-2 text-xl">⟳</div>
                  Scanning Nifty universe for setups...
                </div>
              ) : (
                <div className="flex flex-col gap-6">
                  {/* Section 1: Confirmed Breakouts / Touching Zone */}
                  {(subFilter === "all" || subFilter === "confirmed") && (
                    <StockTable 
                      items={currentConfirmed}
                      title={isTriangleTab ? "✅ Confirmed Pattern Breakouts / Retests" : "✅ Confirmed Touching & Active 44 MA Zone"}
                      icon="⚡"
                      count={currentConfirmed.length}
                      badgeColor="bg-emerald-900/60 text-emerald-300 border border-emerald-500/40"
                      onSelectStock={setSelectedStock}
                      isTriangle={isTriangleTab}
                    />
                  )}

                  {/* Section 2: Pre-Breakout Watchlist */}
                  {(subFilter === "all" || subFilter === "watch") && (
                    <StockTable 
                      items={currentWatch}
                      title={isTriangleTab ? "👀 Pre-Breakout Watchlist (Coiling Near Resistance)" : "👀 Pre-Breakout Watchlist (Near Below 44 MA Coiling)"}
                      icon="👀"
                      count={currentWatch.length}
                      badgeColor="bg-amber-900/60 text-amber-300 border border-amber-500/40"
                      onSelectStock={setSelectedStock}
                      isTriangle={isTriangleTab}
                    />
                  )}
                </div>
              )}
            </main>
          </div>

          {/* Interactive TradingView Chart Modal with Trendlines & Breakout Candle Marker */}
          {selectedStock && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-sm p-4">
              <div className="bg-gray-900 border border-gray-700 rounded-2xl w-full max-w-5xl overflow-hidden shadow-2xl flex flex-col">
                {/* Modal Header */}
                <div className="px-5 py-4 border-b border-gray-800 flex items-center justify-between bg-gray-950">
                  <div className="flex items-center gap-3 flex-wrap">
                    <span className="text-xl font-bold text-white font-mono">{selectedStock.symbol}</span>
                    <span className="text-sm text-gray-400 font-sans">{selectedStock.company}</span>
                    <span className="text-sm font-bold text-emerald-400 font-mono">₹{fmt(selectedStock.cmp)}</span>
                    
                    {selectedStock.ma44 && (
                      <span className="text-xs px-2.5 py-0.5 rounded bg-blue-900/40 text-blue-300 border border-blue-500/30 font-mono">
                        44 MA: ₹{fmt(selectedStock.ma44)} ({selectedStock.distance_pct > 0 ? '+' : ''}{selectedStock.distance_pct}%)
                      </span>
                    )}

                    {selectedStock.pattern && (
                      <span className="text-xs px-2.5 py-0.5 rounded bg-purple-900/40 text-purple-300 border border-purple-500/30 font-semibold font-sans">
                        {selectedStock.pattern} ({selectedStock.status})
                      </span>
                    )}
                  </div>

                  <div className="flex items-center gap-3">
                    {/* Timeframe Switcher in Modal */}
                    <div className="flex rounded-lg bg-gray-800 p-0.5 border border-gray-700 text-xs font-medium">
                      <button 
                        onClick={() => setChartTf("daily")}
                        className={`px-3 py-1 rounded-md transition ${chartTf === "daily" ? "bg-blue-600 text-white font-bold" : "text-gray-400 hover:text-white"}`}
                      >
                        Daily
                      </button>
                      <button 
                        onClick={() => setChartTf("weekly")}
                        className={`px-3 py-1 rounded-md transition ${chartTf === "weekly" ? "bg-blue-600 text-white font-bold" : "text-gray-400 hover:text-white"}`}
                      >
                        Weekly
                      </button>
                    </div>

                    <button 
                      onClick={() => {
                        setSelectedStock(null);
                        setChartDataState(null);
                      }}
                      className="text-gray-400 hover:text-white p-1 rounded-lg hover:bg-gray-800 text-lg leading-none"
                    >
                      ✕
                    </button>
                  </div>
                </div>

                {/* Pattern Metrics Bar in Modal (Target, Stoploss, Risk:Reward) */}
                {selectedStock.target && (
                  <div className="bg-gray-950/90 px-5 py-2.5 border-b border-gray-800 text-xs flex flex-wrap items-center justify-between gap-4">
                    <div className="flex items-center gap-5">
                      <span>Resistance: <b className="text-red-400 font-mono">₹{fmt(selectedStock.resistance_level)}</b></span>
                      <span>Support: <b className="text-emerald-400 font-mono">₹{fmt(selectedStock.support_level)}</b></span>
                      <span>Target (1:3): <b className="text-emerald-300 font-mono">₹{fmt(selectedStock.target)}</b></span>
                      <span>Stop-Loss: <b className="text-rose-400 font-mono">₹{fmt(selectedStock.stop_loss)}</b></span>
                    </div>
                    <div className="flex items-center gap-2">
                      <span className="px-2 py-0.5 rounded bg-emerald-950 text-emerald-300 border border-emerald-500/30 font-mono font-bold">
                        R:R {selectedStock.risk_reward}
                      </span>
                    </div>
                  </div>
                )}

                {/* Lightweight Chart Render Box */}
                <div className="p-4 bg-[#0b0f19]">
                  <div ref={chartContainerRef} className="w-full h-[480px]"></div>
                </div>

                {/* Modal Footer Notes with Pattern Legend */}
                <div className="px-5 py-3 border-t border-gray-800 bg-gray-950/80 flex items-center justify-between text-xs text-gray-400">
                  <div className="flex items-center gap-4 flex-wrap">
                    <span className="flex items-center gap-1.5">
                      <span className="w-3 h-0.5 bg-blue-500 inline-block"></span>
                      <span>Blue Line: 44-Period MA</span>
                    </span>
                    <span className="flex items-center gap-1.5">
                      <span className="w-3 h-0.5 bg-red-400 inline-block"></span>
                      <span>Red Line: Upper Resistance</span>
                    </span>
                    <span className="flex items-center gap-1.5">
                      <span className="w-3 h-0.5 bg-emerald-400 inline-block"></span>
                      <span>Green Line: Lower Support</span>
                    </span>
                    <span className="flex items-center gap-1.5">
                      <span className="text-emerald-400 font-bold">▼</span>
                      <span className="text-emerald-300">Green Arrow: Breakout Candle</span>
                    </span>
                  </div>
                  <div>
                    <a 
                      href={`https://in.tradingview.com/chart/?symbol=NSE:${selectedStock.symbol}`}
                      target="_blank" 
                      rel="noopener noreferrer"
                      className="text-blue-400 hover:underline flex items-center gap-1"
                    >
                      Open on TradingView ↗
                    </a>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Footer Disclaimer */}
          <footer className="border-t border-gray-800 bg-[#0b0f19] py-4 px-5 text-center text-xs text-gray-500 mt-auto">
            <p>For educational purposes only. Not investment advice.</p>
            <p className="mt-1 text-[11px] text-gray-600">
              44 MA Touch & Near Scanner Engine • Separate Daily & Weekly Alert Sections • Confirmed & Pre-Breakout Watchlists
            </p>
          </footer>
        </div>
      );
    }

    // Mount to DOM
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
