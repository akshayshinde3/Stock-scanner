<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>44 MA Touch & Near Scanner — Indian Stocks Screener</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brandDark: '#0b0f19',
            cardDark: '#111827',
            borderDark: '#1f2937',
            accentBlue: '#3b82f6',
            accentGreen: '#10b981',
            accentOrange: '#f59e0b',
            accentPurple: '#8b5cf6',
            accentCyan: '#06b6d4',
          },
          fontFamily: {
            mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- React 18, ReactDOM & Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lightweight Charts (TradingView) -->
  <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>

  <style>
    body {
      background-color: #0b0f19;
      color: #e5e7eb;
      font-family: 'Inter', sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #111827;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 3px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #4b5563;
    }
    .sparkline-path {
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-[#0b0f19] text-gray-200 antialiased selection:bg-blue-600 selection:text-white">

  <!-- Root React App Container -->
  <div id="root" class="flex-1 flex flex-col"></div>

  <!-- React Application Logic -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    // Helper: format Indian rupee numbers
    const fmt = (n) => (n == null || isNaN(n) ? "—" : Number(n).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
    const fmtVol = (n) => {
      if (!n) return "0";
      if (n >= 10000000) return (n / 10000000).toFixed(2) + " Cr";
      if (n >= 100000) return (n / 100000).toFixed(2) + " L";
      if (n >= 1000) return (n / 1000).toFixed(1) + " K";
      return n.toLocaleString("en-IN");
    };

    // Component: Mini Sparkline
    const Sparkline = ({ points, isUp }) => {
      if (!points || points.length < 2) return <span className="text-gray-600">—</span>;
      const min = Math.min(...points);
      const max = Math.max(...points);
      const range = max - min || 1;
      const width = 76;
      const height = 22;
      
      const pathData = points.map((p, i) => {
        const x = (i / (points.length - 1)) * width;
        const y = height - ((p - min) / range) * (height - 4) - 2;
        return `${i === 0 ? 'M' : 'L'} ${x.toFixed(1)} ${y.toFixed(1)}`;
      }).join(' ');

      const strokeColor = isUp ? "#10b981" : "#ef4444";
      return (
        <svg width={width} height={height} className="overflow-visible">
          <path d={pathData} className="sparkline-path" stroke={strokeColor} />
        </svg>
      );
    };

    // Main App Component
    function App() {
      // Top State
      // Tabs: 'both', 'daily', 'weekly', 'ascending', 'symmetrical', 'breakout_hub'
      const [activeTab, setActiveTab] = useState("both");
      const [indexSelector, setIndexSelector] = useState("nifty500");
      const [loading, setLoading] = useState(false);
      const [lastUpdated, setLastUpdated] = useState("");
      const [searchQuery, setSearchQuery] = useState("");

      // 44 MA Scanner Results & Counts
      const [scannerData, setScannerData] = useState({ both: [], daily: [], weekly: [] });
      const [counts, setCounts] = useState({ both: 0, daily: 0, weekly: 0, total_qualifying: 0 });

      // Triangles Results
      const [trianglesData, setTrianglesData] = useState({
        ascending: [],
        symmetrical: [],
        confirmed_breakouts: [],
        pre_breakouts: [],
      });

      // Sidebar Filters (All User Adjustable)
      const [maxAbove, setMaxAbove] = useState(2.0); // Slider: 0.5% - 5.0%, default 2%
      const [maxBelow, setMaxBelow] = useState(3.0); // Slider: 0.5% - 5.0%, default 3%
      const [statusTouch, setStatusTouch] = useState(true);
      const [statusAbove, setStatusAbove] = useState(true);
      const [statusNearBelow, setStatusNearBelow] = useState(true);
      const [minPrice, setMinPrice] = useState(0);
      const [minWeeklyVol, setMinWeeklyVol] = useState(100000);
      const [risingOnly, setRisingOnly] = useState(false);
      const [greenOnly, setGreenOnly] = useState(false);

      // Table Sorting
      const [sortField, setSortField] = useState("abs_distance");
      const [sortAsc, setSortAsc] = useState(true);

      // Modal Chart View & Fast Prefetch Cache (<5s loading)
      const [selectedStock, setSelectedStock] = useState(null);
      const [chartTf, setChartTf] = useState("daily");
      const chartContainerRef = useRef(null);
      const chartInstance = useRef(null);
      const chartCacheRef = useRef(new Map());

      // Hover prefetch for instantaneous chart opening
      const prefetchChart = useCallback((sym, tf = "daily") => {
        if (!sym) return;
        const key = `${sym.toUpperCase()}_${tf}`;
        if (chartCacheRef.current.has(key)) return;
        fetch(`/api/chart/${sym}?tf=${tf}`)
          .then(res => res.json())
          .then(data => {
            if (data && data.candles) {
              chartCacheRef.current.set(key, data);
            }
          })
          .catch(() => {});
      }, []);

      // Fetch 44 MA Data
      const fetch44MaData = async (forceRefresh = false) => {
        setLoading(true);
        try {
          const statuses = [];
          if (statusTouch) statuses.push("touching");
          if (statusAbove) statuses.push("above");
          if (statusNearBelow) statuses.push("near below");

          const params = new URLSearchParams({
            index: indexSelector,
            max_above: maxAbove,
            max_below: maxBelow,
            min_price: minPrice,
            min_weekly_vol: minWeeklyVol,
            rising_only: risingOnly ? "1" : "0",
            green_only: greenOnly ? "1" : "0",
            statuses: statuses.join(","),
            refresh: forceRefresh ? "1" : "0"
          });

          const res = await fetch(`/api/scanner/44ma?${params.toString()}`);
          if (!res.ok) throw new Error("Failed to load 44 MA scanner data");
          const data = await res.json();
          setScannerData(data.results || { both: [], daily: [], weekly: [] });
          setCounts(data.counts || { both: 0, daily: 0, weekly: 0 });
          setLastUpdated(data.last_updated || new Date().toLocaleTimeString());
        } catch (err) {
          console.error("44 MA Scanner fetch error:", err);
        } finally {
          setLoading(false);
        }
      };

      // Fetch Triangles Data
      const fetchTrianglesData = async () => {
        try {
          const res = await fetch(`/api/scanner/triangles?index=${indexSelector}&timeframe=daily`);
          if (!res.ok) throw new Error("Failed to load triangle data");
          const data = await res.json();
          setTrianglesData({
            ascending: data.ascending || [],
            symmetrical: data.symmetrical || [],
            confirmed_breakouts: data.confirmed_breakouts || [],
            pre_breakouts: data.pre_breakouts || [],
          });
        } catch (err) {
          console.error("Triangles fetch error:", err);
        }
      };

      // Load data on filter change
      useEffect(() => {
        fetch44MaData();
        fetchTrianglesData();
      }, [indexSelector, maxAbove, maxBelow, statusTouch, statusAbove, statusNearBelow, minPrice, minWeeklyVol, risingOnly, greenOnly]);

      // Filter and Sort helper
      const sortItems = (items) => {
        let filtered = [...items];
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase().trim();
          filtered = filtered.filter(it => 
            it.symbol.toLowerCase().includes(q) || 
            (it.company && it.company.toLowerCase().includes(q))
          );
        }
        return filtered.sort((a, b) => {
          let valA = a[sortField];
          let valB = b[sortField];
          if (valA == null) valA = 0;
          if (valB == null) valB = 0;
          if (typeof valA === "string") {
            return sortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
          }
          return sortAsc ? valA - valB : valB - valA;
        });
      };

      const handleSort = (field) => {
        if (sortField === field) {
          setSortAsc(!sortAsc);
        } else {
          setSortField(field);
          setSortAsc(true);
        }
      };

      // Status badge styling
      const getStatusBadge = (status) => {
        if (status === "Touching") {
          return "bg-blue-900/40 text-blue-300 border-blue-500/40";
        } else if (status && status.includes("Above")) {
          return "bg-emerald-900/40 text-emerald-300 border-emerald-500/40";
        } else if (status === "Near Below") {
          return "bg-amber-900/40 text-amber-300 border-amber-500/40";
        } else if (status && status.includes("Confirmed")) {
          return "bg-emerald-900/50 text-emerald-300 border-emerald-500/50 shadow-sm";
        } else if (status && status.includes("Watch")) {
          return "bg-amber-900/40 text-amber-300 border-amber-500/40";
        }
        return "bg-gray-800 text-gray-300 border-gray-700";
      };

      // Render TradingView Lightweight Chart in Modal with Pattern & Breakout Marker
      useEffect(() => {
        if (!selectedStock || !chartContainerRef.current) return;

        let isMounted = true;
        const container = chartContainerRef.current;
        container.innerHTML = "";

        const chart = LightweightCharts.createChart(container, {
          width: container.clientWidth,
          height: 480,
          layout: {
            background: { color: "#0b0f19" },
            textColor: "#9ca3af",
          },
          grid: {
            vertLines: { color: "#1a2234" },
            horzLines: { color: "#1a2234" },
          },
          timeScale: {
            borderColor: "#374151",
            timeVisible: true,
          },
          rightPriceScale: {
            borderColor: "#374151",
          },
        });
        chartInstance.current = chart;

        const candleSeries = chart.addCandlestickSeries({
          upColor: "#10b981",
          downColor: "#ef4444",
          borderVisible: false,
          wickUpColor: "#10b981",
          wickDownColor: "#ef4444",
        });

        const ma44Series = chart.addLineSeries({
          color: "#3b82f6",
          lineWidth: 2,
          title: "44 MA",
        });

        // Upper & Lower Pattern Lines Series
        const upperTrendSeries = chart.addLineSeries({
          color: "#38bdf8", // bright cyan matching chart diagrams
          lineWidth: 2,
          title: "Upper Resistance",
        });

        const lowerTrendSeries = chart.addLineSeries({
          color: "#38bdf8",
          lineWidth: 2,
          title: "Lower Support",
        });

        const applyChartPayload = (data) => {
          if (!isMounted || !data || !data.candles) return;

          candleSeries.setData(data.candles);
          if (data.ma44_line && data.ma44_line.length > 0) {
            ma44Series.setData(data.ma44_line);
          }

          // Check if pattern is present (either ascending or symmetrical)
          const pat = data.ascending_pattern || data.symmetrical_pattern || selectedStock;
          
          if (pat && pat.upper_line_points && pat.upper_line_points.length > 0) {
            upperTrendSeries.setData(pat.upper_line_points);
          }
          if (pat && pat.lower_line_points && pat.lower_line_points.length > 0) {
            lowerTrendSeries.setData(pat.lower_line_points);
          }

          // Price Lines: Entry, Target, Stop Loss (Educational R:R)
          if (pat && pat.buy_price) {
            candleSeries.createPriceLine({
              price: pat.buy_price,
              color: "#06b6d4",
              lineWidth: 2,
              lineStyle: LightweightCharts.LineStyle.Solid,
              axisLabelVisible: true,
              title: `ENTRY: ₹${pat.buy_price}`,
            });
          }
          if (pat && pat.target) {
            candleSeries.createPriceLine({
              price: pat.target,
              color: "#10b981",
              lineWidth: 2,
              lineStyle: LightweightCharts.LineStyle.Dashed,
              axisLabelVisible: true,
              title: `TARGET (1:3): ₹${pat.target}`,
            });
          }
          if (pat && pat.stop_loss) {
            candleSeries.createPriceLine({
              price: pat.stop_loss,
              color: "#ef4444",
              lineWidth: 2,
              lineStyle: LightweightCharts.LineStyle.Dashed,
              axisLabelVisible: true,
              title: `STOP LOSS: ₹${pat.stop_loss}`,
            });
          }

          // BREAKOUT CANDLE MARKER on chart!
          const markers = [];
          if (pat && pat.breakout_date) {
            markers.push({
              time: pat.breakout_date,
              position: "aboveBar",
              color: "#10b981",
              shape: "arrowDown",
              text: `BREAKOUT CANDLE 🚀 (${pat.status || 'Confirmed'})`,
              size: 2,
            });
          } else if (data.status_44ma && data.candles.length > 0) {
            // 44 MA touch or zone marker on latest bar
            const lastBar = data.candles[data.candles.length - 1];
            markers.push({
              time: lastBar.time,
              position: data.status_44ma === "Near Below" ? "belowBar" : "aboveBar",
              color: data.status_44ma === "Touching" ? "#3b82f6" : (data.status_44ma.includes("Above") ? "#10b981" : "#f59e0b"),
              shape: data.status_44ma === "Near Below" ? "arrowUp" : "arrowDown",
              text: `44 MA: ${data.status_44ma}`,
              size: 2,
            });
          }

          if (markers.length > 0) {
            candleSeries.setMarkers(markers);
          }

          chart.timeScale().fitContent();
        };

        const cacheKey = `${selectedStock.symbol.toUpperCase()}_${chartTf}`;
        if (chartCacheRef.current.has(cacheKey)) {
          // Instant load from RAM cache (<0.01s)
          applyChartPayload(chartCacheRef.current.get(cacheKey));
        } else {
          // Fetch from API (<1s)
          fetch(`/api/chart/${selectedStock.symbol}?tf=${chartTf}`)
            .then(res => res.json())
            .then(data => {
              chartCacheRef.current.set(cacheKey, data);
              applyChartPayload(data);
            })
            .catch(err => console.error("Chart load err:", err));
        }

        const handleResize = () => {
          if (chartInstance.current && container) {
            chartInstance.current.applyOptions({ width: container.clientWidth });
          }
        };
        window.addEventListener("resize", handleResize);

        return () => {
          isMounted = false;
          window.removeEventListener("resize", handleResize);
          if (chartInstance.current) {
            chartInstance.current.remove();
            chartInstance.current = null;
          }
        };
      }, [selectedStock, chartTf]);

      // Sub-lists for Triangles: Separate Confirmed vs Pre-Breakout
      const ascConfirmed = useMemo(() => sortItems(trianglesData.ascending.filter(x => x.status && x.status.includes("Confirmed"))), [trianglesData.ascending, searchQuery, sortField, sortAsc]);
      const ascPreBreakout = useMemo(() => sortItems(trianglesData.ascending.filter(x => x.status && x.status.includes("Watch"))), [trianglesData.ascending, searchQuery, sortField, sortAsc]);

      const symmConfirmed = useMemo(() => sortItems(trianglesData.symmetrical.filter(x => x.status && x.status.includes("Confirmed"))), [trianglesData.symmetrical, searchQuery, sortField, sortAsc]);
      const symmPreBreakout = useMemo(() => sortItems(trianglesData.symmetrical.filter(x => x.status && x.status.includes("Watch"))), [trianglesData.symmetrical, searchQuery, sortField, sortAsc]);

      const allConfirmed = useMemo(() => sortItems(trianglesData.confirmed_breakouts), [trianglesData.confirmed_breakouts, searchQuery, sortField, sortAsc]);
      const allPreBreakouts = useMemo(() => sortItems(trianglesData.pre_breakouts), [trianglesData.pre_breakouts, searchQuery, sortField, sortAsc]);

      // Sub-lists for 44 MA
      const bothList = useMemo(() => sortItems(scannerData.both), [scannerData.both, searchQuery, sortField, sortAsc]);
      const dailyList = useMemo(() => sortItems(scannerData.daily), [scannerData.daily, searchQuery, sortField, sortAsc]);
      const weeklyList = useMemo(() => sortItems(scannerData.weekly), [scannerData.weekly, searchQuery, sortField, sortAsc]);

      // Category counts for Daily alerts
      const dailyTouchingCount = useMemo(() => scannerData.daily.filter(x => x.status === "Touching").length, [scannerData.daily]);
      const dailyAboveCount = useMemo(() => scannerData.daily.filter(x => x.status && x.status.includes("Above")).length, [scannerData.daily]);
      const dailyNearBelowCount = useMemo(() => scannerData.daily.filter(x => x.status === "Near Below").length, [scannerData.daily]);

      // Category counts for Weekly alerts
      const weeklyTouchingCount = useMemo(() => scannerData.weekly.filter(x => x.status === "Touching").length, [scannerData.weekly]);
      const weeklyAboveCount = useMemo(() => scannerData.weekly.filter(x => x.status && x.status.includes("Above")).length, [scannerData.weekly]);
      const weeklyNearBelowCount = useMemo(() => scannerData.weekly.filter(x => x.status === "Near Below").length, [scannerData.weekly]);

      return (
        <div className="flex flex-col min-h-screen">
          {/* Header */}
          <header className="border-b border-gray-800 bg-[#0f172a] px-5 py-3 sticky top-0 z-30 shadow-md">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-lg bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-blue-400 font-bold font-mono text-xl shadow-inner">
                  44
                </div>
                <div>
                  <h1 className="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                    44 MA Touch & Near Scanner
                    <span className="text-xs px-2 py-0.5 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20 font-normal">
                      NSE Indian Markets
                    </span>
                  </h1>
                  <p className="text-xs text-gray-400">
                    44 MA Touch & Near • Ascending & Symmetrical Triangles • 1:3 R:R Breakouts
                  </p>
                </div>
              </div>

              {/* Header Right Controls */}
              <div className="flex items-center flex-wrap gap-3">
                {/* Index Selector Dropdown */}
                <div className="flex items-center space-x-1.5 bg-gray-900 border border-gray-700/60 rounded-lg px-2.5 py-1 text-xs">
                  <span className="text-gray-400 font-medium">Universe:</span>
                  <select 
                    value={indexSelector} 
                    onChange={(e) => setIndexSelector(e.target.value)}
                    className="bg-transparent text-white font-semibold focus:outline-none cursor-pointer"
                  >
                    <option value="nifty500" className="bg-gray-900">Nifty 500 (Full)</option>
                    <option value="nifty100" className="bg-gray-900">Nifty 100 (Large)</option>
                    <option value="nifty50" className="bg-gray-900">Nifty 50 (Core)</option>
                  </select>
                </div>

                {/* CSV Export Button */}
                <a 
                  href={`/api/export/csv?tab=${activeTab}&index=${indexSelector}&max_above=${maxAbove}&max_below=${maxBelow}`}
                  className="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg bg-gray-800 hover:bg-gray-700 text-xs font-medium text-gray-200 border border-gray-700 transition"
                  title="Export results to CSV"
                >
                  <span>⬇ Export CSV</span>
                </a>

                {/* Refresh Button */}
                <button 
                  onClick={() => { fetch44MaData(true); fetchTrianglesData(); }} 
                  disabled={loading}
                  className="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-xs font-semibold text-white shadow-sm transition disabled:opacity-50"
                >
                  <span>{loading ? "Scanning..." : "⟳ Scan Live"}</span>
                </button>
              </div>
            </div>
          </header>

          {/* Subheader Status Banner */}
          <div className="bg-[#111827]/70 border-b border-gray-800/80 px-5 py-2 text-xs text-gray-400">
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              <div className="flex items-center gap-4">
                <span className="flex items-center gap-1.5">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span>EOD Cached & Refreshed after 4:00 PM IST</span>
                </span>
                <span>•</span>
                <span>Last Updated: <b className="text-gray-300 font-mono">{lastUpdated || "Live"}</b></span>
              </div>
              <div className="text-gray-400 hidden sm:block">
                Touch: Low ≤ 44MA ≤ High • Above Zone: 0 to +{maxAbove}% • Near Below: 0 to -{maxBelow}%
              </div>
            </div>
          </div>

          {/* Main Layout: Sidebar Filters + Results Content */}
          <div className="max-w-7xl mx-auto w-full px-4 py-5 flex-1 flex flex-col lg:flex-row gap-6">
            
            {/* SIDEBAR FILTERS (All User Adjustable) */}
            <aside className="w-full lg:w-72 flex-shrink-0 bg-gray-900/90 border border-gray-800 rounded-xl p-4 flex flex-col gap-5 shadow-lg h-fit">
              <div className="flex items-center justify-between border-b border-gray-800 pb-2.5">
                <h2 className="text-sm font-bold text-white flex items-center gap-2">
                  <span>⚙</span> Screener Filters
                </h2>
                <button 
                  onClick={() => {
                    setMaxAbove(2.0);
                    setMaxBelow(3.0);
                    setStatusTouch(true);
                    setStatusAbove(true);
                    setStatusNearBelow(true);
                    setMinPrice(0);
                    setMinWeeklyVol(100000);
                    setRisingOnly(false);
                    setGreenOnly(false);
                  }}
                  className="text-[11px] text-blue-400 hover:underline"
                >
                  Reset Defaults
                </button>
              </div>

              {/* Slider 1: Max Above MA44 (0.5% - 5%) */}
              <div>
                <div className="flex justify-between text-xs mb-1">
                  <span className="text-gray-300 font-medium">Max Above MA44 (+A)</span>
                  <span className="font-mono text-emerald-400 font-bold">+{maxAbove.toFixed(1)}%</span>
                </div>
                <input 
                  type="range" 
                  min="0.5" 
                  max="5.0" 
                  step="0.1" 
                  value={maxAbove}
                  onChange={(e) => setMaxAbove(parseFloat(e.target.value))}
                  className="w-full accent-emerald-500 cursor-pointer h-1.5 bg-gray-700 rounded-lg"
                />
                <span className="text-[10px] text-gray-500">Excludes stocks &gt; {maxAbove}% above MA44</span>
              </div>

              {/* Slider 2: Max Below MA44 (0.5% - 5%) */}
              <div>
                <div className="flex justify-between text-xs mb-1">
                  <span className="text-gray-300 font-medium">Max Below MA44 (-B)</span>
                  <span className="font-mono text-amber-400 font-bold">-{maxBelow.toFixed(1)}%</span>
                </div>
                <input 
                  type="range" 
                  min="0.5" 
                  max="5.0" 
                  step="0.1" 
                  value={maxBelow}
                  onChange={(e) => setMaxBelow(parseFloat(e.target.value))}
                  className="w-full accent-amber-500 cursor-pointer h-1.5 bg-gray-700 rounded-lg"
                />
                <span className="text-[10px] text-gray-500">Qualifies down to -{maxBelow}% below MA44</span>
              </div>

              {/* Status Checkboxes */}
              <div className="border-t border-gray-800 pt-3">

                    <div className="text-gray-400">
                      Resistance: ₹{fmt(selectedStock.resistance_level)} • Touches: {selectedStock.touches}
                    </div>
                  </div>
                )}

                {/* Lightweight Chart Render Box */}
                <div className="p-4 bg-[#0b0f19]">
                  <div ref={chartContainerRef} className="w-full h-[460px]"></div>
                </div>

                {/* Modal Footer Notes */}
                <div className="px-5 py-2.5 border-t border-gray-800 bg-gray-950/80 flex items-center justify-between text-xs text-gray-400">
                  <div className="flex items-center gap-4">
                    <span className="flex items-center gap-1.5">
                      <span className="w-3 h-0.5 bg-blue-500 inline-block"></span>
                      <span>44 MA (Blue)</span>
                    </span>
                    <span className="flex items-center gap-1.5">
                      <span className="w-3 h-0.5 bg-cyan-400 inline-block"></span>
                      <span>Pattern Lines (Cyan)</span>
                    </span>
                    <span className="flex items-center gap-1.5">
                      <span className="w-3 h-0.5 bg-emerald-500 inline-block border-b border-dashed"></span>
                      <span>Target 1:3 (Green)</span>
                    </span>
                    <span className="flex items-center gap-1.5">
                      <span className="w-3 h-0.5 bg-rose-500 inline-block border-b border-dashed"></span>
                      <span>Stop Loss (Red)</span>
                    </span>
                  </div>
                  <div>
                    <a 
                      href={`https://in.tradingview.com/chart/?symbol=NSE:${selectedStock.symbol}`}
                      target="_blank" 
                      rel="noopener noreferrer"
                      className="text-blue-400 hover:underline flex items-center gap-1"
                    >
                      Open on TradingView ↗
                    </a>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Footer Disclaimer */}
          <footer className="border-t border-gray-800 bg-[#0b0f19] py-4 px-5 text-center text-xs text-gray-500 mt-auto">
            <p>For educational purposes only. Not investment advice.</p>
            <p className="mt-1 text-[11px] text-gray-600">
              44 MA Touch & Near Scanner Engine • Ascending & Symmetrical Triangles • Built for Indian Technical Traders
            </p>
          </footer>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────────────────────
    // Sub-Component: 44 MA Table
    // ─────────────────────────────────────────────────────────────────────────
    function MaTable({ items, loading, onSelect, onHover, handleSort, sortField, sortAsc, getStatusBadge }) {
      return (
        <div className="overflow-x-auto rounded-xl border border-gray-800 bg-gray-900/80 shadow-md custom-scrollbar">
          <table className="w-full text-left text-xs border-collapse">
            <thead>
              <tr className="border-b border-gray-800 bg-gray-950/70 text-gray-400 font-semibold select-none">
                <th className="py-3 px-4 cursor-pointer hover:text-white" onClick={() => handleSort("symbol")}>
                  Symbol {sortField === "symbol" && (sortAsc ? "▲" : "▼")}
                </th>
                <th className="py-3 px-3">Company</th>
                <th className="py-3 px-3 text-right cursor-pointer hover:text-white" onClick={() => handleSort("cmp")}>
                  CMP (₹) {sortField === "cmp" && (sortAsc ? "▲" : "▼")}
                </th>
                <th className="py-3 px-3 text-right cursor-pointer hover:text-white" onClick={() => handleSort("ma44")}>
                  44 MA {sortField === "ma44" && (sortAsc ? "▲" : "▼")}
                </th>
                <th className="py-3 px-3 text-right cursor-pointer hover:text-white" onClick={() => handleSort("abs_distance")}>
                  Distance % {sortField === "abs_distance" && (sortAsc ? "▲" : "▼")}
                </th>
                <th className="py-3 px-3 text-center">Status</th>
                <th className="py-3 px-3 text-right cursor-pointer hover:text-white" onClick={() => handleSort("day_change_pct")}>
                  Day Chg % {sortField === "day_change_pct" && (sortAsc ? "▲" : "▼")}
                </th>
                <th className="py-3 px-3 text-right">Volume</th>
                <th className="py-3 px-3 text-center">Timeframe</th>
                <th className="py-3 px-3 text-center">Trend (12B)</th>
                <th className="py-3 px-4 text-center">Chart</th>
              </tr>
            </thead>
            <tbody className="divide-y divide-gray-800/60 font-mono">
              {loading ? (
                <tr>
                  <td colSpan="11" className="py-12 text-center text-gray-500 font-sans">
                    <div className="inline-block animate-spin mr-2">⟳</div>
                    Scanning Nifty universe...
                  </td>
                </tr>
              ) : items.length === 0 ? (
                <tr>
                  <td colSpan="11" className="py-12 text-center text-gray-500 font-sans">
                    No stocks found matching active filters. Adjust your sliders or status checkboxes.
                  </td>
                </tr>
              ) : (
                items.map((item) => {
                  const isUp = (item.day_change_pct || 0) >= 0;
                  const dist = item.distance_pct != null ? item.distance_pct : 0;
                  const statusStyle = getStatusBadge(item.status);

                  return (
                    <tr 
                      key={item.symbol} 
                      className="hover:bg-gray-800/50 transition cursor-pointer"
                      onClick={() => onSelect(item)}
                      onMouseEnter={() => onHover(item.symbol)}
                    >
                      <td className="py-3 px-4 font-bold text-white hover:text-blue-400">
                        {item.symbol}
                      </td>
                      <td className="py-3 px-3 font-sans text-gray-300 text-xs truncate max-w-[150px]" title={item.company}>
                        {item.company}
                      </td>
                      <td className="py-3 px-3 text-right font-bold text-gray-100">
                        ₹{fmt(item.cmp)}
                      </td>
                      <td className="py-3 px-3 text-right text-blue-400 font-semibold">
                        ₹{fmt(item.ma44)}
                      </td>
                      <td className={`py-3 px-3 text-right font-bold ${dist >= 0 ? 'text-emerald-400' : 'text-amber-400'}`}>
                        {dist > 0 ? `+${dist.toFixed(2)}%` : `${dist.toFixed(2)}%`}
                      </td>
                      <td className="py-3 px-3 text-center font-sans">
                        <span className={`inline-block px-2 py-0.5 rounded text-[11px] font-semibold border ${statusStyle}`}>
                          {item.status}
                        </span>
                      </td>
                      <td className={`py-3 px-3 text-right font-semibold ${isUp ? 'text-emerald-400' : 'text-red-400'}`}>
                        {isUp ? `+${item.day_change_pct.toFixed(2)}%` : `${item.day_change_pct.toFixed(2)}%`}
                      </td>
                      <td className="py-3 px-3 text-right text-gray-400">
                        {fmtVol(item.volume)}
                      </td>
                      <td className="py-3 px-3 text-center font-sans">
                        <span className={`inline-block px-2 py-0.5 rounded text-[10px] font-semibold ${
                          item.timeframe === "Both" 
                            ? "bg-purple-900/40 text-purple-300 border border-purple-500/30" 
                            : "bg-gray-800 text-gray-400 border border-gray-700"
                        }`}>
                          {item.timeframe}
                        </span>
                      </td>
                      <td className="py-3 px-3 text-center">
                        <Sparkline points={item.sparkline} isUp={isUp} />
                      </td>
                      <td className="py-3 px-4 text-center font-sans">
                        <button 
                          onClick={(e) => {
                            e.stopPropagation();
                            onSelect(item);
                          }}
                          className="px-2.5 py-1 rounded bg-blue-600/20 hover:bg-blue-600/40 text-blue-400 text-xs font-semibold border border-blue-500/30 transition"
                        >
                          View 44 MA
                        </button>
                      </td>
                    </tr>
                  );
                })
              )}
            </tbody>
          </table>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────────────────────
    // Sub-Component: Triangle Table (Confirmed & Pre-Breakout)
    // ─────────────────────────────────────────────────────────────────────────
    function TriangleTable({ items, onSelect, onHover, handleSort, sortField, sortAsc, getStatusBadge, emptyText }) {
      return (
        <div className="overflow-x-auto rounded-xl border border-gray-800 bg-gray-900/80 shadow-md custom-scrollbar">
          <table className="w-full text-left text-xs border-collapse">
            <thead>
              <tr className="border-b border-gray-800 bg-gray-950/70 text-gray-400 font-semibold select-none">
                <th className="py-3 px-4 cursor-pointer hover:text-white" onClick={() => handleSort("symbol")}>
                  Symbol {sortField === "symbol" && (sortAsc ? "▲" : "▼")}
                </th>
                <th className="py-3 px-3">Company</th>
                <th className="py-3 px-3 text-right cursor-pointer hover:text-white" onClick={() => handleSort("cmp")}>
                  CMP (₹) {sortField === "cmp" && (sortAsc ? "▲" : "▼")}
                </th>
                <th className="py-3 px-3 text-right">Resistance</th>
                <th className="py-3 px-3 text-right">Support</th>
                <th className="py-3 px-3 text-right text-emerald-400 font-bold">Target (1:3)</th>
                <th className="py-3 px-3 text-right text-rose-400">Stop-Loss</th>
                <th className="py-3 px-3 text-center">Status / Entry</th>
                <th className="py-3 px-3 text-center">Touches</th>
                <th className="py-3 px-3 text-center">Trend (12B)</th>
                <th className="py-3 px-4 text-center">Action</th>
              </tr>
            </thead>
            <tbody className="divide-y divide-gray-800/60 font-mono">
              {items.length === 0 ? (
                <tr>
                  <td colSpan="11" className="py-8 text-center text-gray-500 font-sans">
                    {emptyText || "No matching patterns."}
                  </td>
                </tr>
              ) : (
                items.map((item) => {
                  const isUp = (item.cmp >= (item.resistance_level || 0));
                  const statusStyle = getStatusBadge(item.status);

                  return (
                    <tr 
                      key={item.symbol} 
                      className="hover:bg-gray-800/50 transition cursor-pointer"
                      onClick={() => onSelect(item)}
                      onMouseEnter={() => onHover(item.symbol)}
                    >
                      <td className="py-3 px-4 font-bold text-white hover:text-blue-400">
                        {item.symbol}
                      </td>
                      <td className="py-3 px-3 font-sans text-gray-300 text-xs truncate max-w-[140px]" title={item.company}>
                        {item.company}
                      </td>
                      <td className="py-3 px-3 text-right font-bold text-gray-100">
                        ₹{fmt(item.cmp)}
                      </td>
                      <td className="py-3 px-3 text-right text-red-400 font-semibold">
                        ₹{fmt(item.resistance_level)}
                      </td>
                      <td className="py-3 px-3 text-right text-emerald-400">
                        ₹{fmt(item.support_level)}
                      </td>
                      <td className="py-3 px-3 text-right text-emerald-300 font-bold">
                        ₹{fmt(item.target)}
                      </td>
                      <td className="py-3 px-3 text-right text-rose-400">
                        ₹{fmt(item.stop_loss)}
                      </td>
                      <td className="py-3 px-3 text-center font-sans">
                        <span className={`inline-block px-2 py-0.5 rounded text-[11px] font-semibold border ${statusStyle}`}>
                          {item.status}
                        </span>
                        {item.entry_type && (
                          <div className="text-[10px] text-gray-400 mt-0.5">{item.entry_type}</div>
                        )}
                      </td>
                      <td className="py-3 px-3 text-center text-gray-300">
                        {item.touches} touches
                      </td>
                      <td className="py-3 px-3 text-center">
                        <Sparkline points={item.sparkline} isUp={isUp} />
                      </td>
                      <td className="py-3 px-4 text-center font-sans">
                        <button 
                          onClick={(e) => {
                            e.stopPropagation();
                            onSelect(item);
                          }}
                          className="px-2.5 py-1 rounded bg-emerald-600/20 hover:bg-emerald-600/40 text-emerald-300 text-xs font-semibold border border-emerald-500/30 transition flex items-center gap-1 mx-auto"
                        >
                          <span>Draw Pattern</span>
                        </button>
                      </td>
                    </tr>
                  );
                })
              )}
            </tbody>
          </table>
        </div>
      );
    }

    // Mount to DOM
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
